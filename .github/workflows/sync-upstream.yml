name: Sync upstream

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/manaflow-ai/bonsplit.git

      - name: Fetch upstream
        run: git fetch upstream main

      - name: Merge upstream/main into main
        run: |
          if git merge --no-edit --no-ff upstream/main; then
            echo "Merge succeeded"
          else
            echo "::error::Merge conflict — resolve manually"
            git merge --abort
            exit 1
          fi

      - name: Push to fork
        run: git push origin main
